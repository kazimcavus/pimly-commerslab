# pimly yerel geliştirme bağımlılığı: PostgreSQL.
# .NET backend (backend/) bu veritabanını kullanır — appsettings.json ile uyumlu.
# Kullanım: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    container_name: pimly-postgres
    environment:
      POSTGRES_USER: pimly
      POSTGRES_PASSWORD: pimly
      POSTGRES_DB: pimly
    ports:
      - "5432:5432"
    volumes:
      - pimly_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pimly -d pimly"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pimly_pgdata:
