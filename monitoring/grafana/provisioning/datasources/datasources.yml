apiVersion: 1



datasources:

  - name: Prometheus

    uid: prometheus

    type: prometheus

    access: proxy

    url: http://prometheus:9090

    isDefault: true



  - name: Loki

    uid: loki

    type: loki

    access: proxy

    url: http://loki:3100

    jsonData:

      derivedFields:

        - name: Trace

          datasourceUid: tempo

          matcherRegex: '"@tr":"([0-9a-f]{32})"'

          url: '$${__value.raw}'

        - name: Trace

          datasourceUid: tempo

          matcherRegex: 'trace_id=([0-9a-f]{32})'

          url: '$${__value.raw}'



  - name: Tempo

    uid: tempo

    type: tempo

    access: proxy

    url: http://tempo:3200

    jsonData:

      tracesToLogsV2:

        datasourceUid: loki

        spanStartTimeShift: '-5m'

        spanEndTimeShift: '5m'

        customQuery: true

        query: '{container="pimly-api", trace_id="$${__span.traceId}"}'

      tracesToLogs:

        datasourceUid: loki

        spanStartTimeShift: '-5m'

        spanEndTimeShift: '5m'

        customQuery: true

        query: '{container="pimly-api", trace_id="$${__span.traceId}"}'

      tracesToMetrics:

        datasourceUid: prometheus

      serviceMap:

        datasourceUid: prometheus

      nodeGraph:

        enabled: true

      lokiSearch:

        datasourceUid: loki


