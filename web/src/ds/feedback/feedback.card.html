<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 22px; background: var(--bg-app); }
  .wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  .stack { display: flex; flex-direction: column; gap: 10px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Banner, Toast, Tooltip, EmptyState, Button, IconButton } = window.PimlyDesignSystem_e88117;
  const I = (n) => <i data-lucide={n}></i>;
  function Demo() {
    return (
      <div className="wrap">
        <div className="stack">
          <Banner tone="info" title="İpucu">Beden seçip satırları toplu üretebilirsin.</Banner>
          <Banner tone="success" title="Senkronize edildi">Trendyol eşlemesi güncel.</Banner>
          <Banner tone="warning" title="Salt-okunur mod">readonly rolündesin; değişiklik yapamazsın.</Banner>
          <Banner tone="danger" title="Kayıt başarısız">3 zorunlu alan eksik.</Banner>
        </div>
        <div className="stack">
          <Toast tone="success" title="Ürün kaydedildi" onClose={()=>{}}>4 ürün, 18 varyant oluşturuldu.</Toast>
          <Toast tone="danger" title="Bağlantı hatası" onClose={()=>{}}>İstek zaman aşımına uğradı.</Toast>
          <div style={{display:'flex',gap:10,alignItems:'center',padding:'4px 0'}}>
            <Tooltip label="Diğer işlemler"><IconButton icon={I('more-horizontal')} label="Diğer" variant="secondary" /></Tooltip>
            <span style={{fontSize:13,color:'var(--text-muted)'}}>← hover for tooltip</span>
          </div>
          <div style={{border:'1px solid var(--border-default)',borderRadius:10,background:'var(--surface)'}}>
            <EmptyState icon="package" title="Henüz ürün grubu yok"
              description="İlk grubunu oluştur; ürünler ve varyantlar tek formda eklenir."
              action={<Button variant="accent" iconLeft={I('plus')}>Ürün Oluştur</Button>} />
          </div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  setTimeout(() => window.lucide && window.lucide.createIcons(), 0);
</script>
</body>
</html>
