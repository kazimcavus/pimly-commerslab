<!-- @dsCard group="Components" viewport="700x360" name="Buttons" subtitle="Ink primary, emerald accent, secondary, ghost, danger + icon buttons" -->
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 22px; background: var(--bg-app); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 16px; }
  .lbl { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--text-subtle); width: 100%; margin-bottom: -2px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Button, IconButton } = window.PimlyDesignSystem_e88117;
  const I = (n) => <i data-lucide={n}></i>;
  function Demo() {
    return (
      <div>
        <div className="row"><span className="lbl">Variants</span>
          <Button variant="primary">Kaydet</Button>
          <Button variant="accent" iconLeft={I('plus')}>Ürün Oluştur</Button>
          <Button variant="secondary">İptal</Button>
          <Button variant="ghost">Daha fazla</Button>
          <Button variant="danger" iconLeft={I('trash-2')}>Sil</Button>
          <Button variant="danger-solid">Kalıcı sil</Button>
        </div>
        <div className="row"><span className="lbl">Sizes</span>
          <Button variant="primary" size="sm">Small</Button>
          <Button variant="primary" size="md">Medium</Button>
          <Button variant="primary" size="lg">Large</Button>
          <Button variant="secondary" loading>Yükleniyor</Button>
          <Button variant="secondary" disabled>Pasif</Button>
        </div>
        <div className="row"><span className="lbl">With icons / icon-only</span>
          <Button variant="secondary" iconLeft={I('upload')}>Yükle</Button>
          <Button variant="secondary" iconRight={I('chevron-down')}>Durum</Button>
          <IconButton icon={I('more-horizontal')} label="Diğer" variant="ghost" />
          <IconButton icon={I('pencil')} label="Düzenle" variant="secondary" />
          <IconButton icon={I('trash-2')} label="Sil" variant="danger" />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  setTimeout(() => window.lucide && window.lucide.createIcons(), 0);
</script>
</body>
</html>
