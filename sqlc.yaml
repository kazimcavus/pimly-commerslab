version: "2"
sql:
  # Global / public-schema tables.
  - engine: "postgresql"
    schema: "migrations/global"
    queries: "db/queries/global"
    gen:
      go:
        package: "globaldb"
        out: "internal/platform/db/globaldb"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
          - db_type: "jsonb"
            nullable: true
            go_type: "encoding/json.RawMessage"

  # Tenant-schema tables. Same generated code runs against ANY tenant schema
  # selected at runtime via search_path. Queries use UNQUALIFIED table names.
  - engine: "postgresql"
    schema: "migrations/tenant_template"
    queries: "db/queries/tenant"
    gen:
      go:
        package: "tenantdb"
        out: "internal/platform/db/tenantdb"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
          - db_type: "jsonb"
            nullable: true
            go_type: "encoding/json.RawMessage"
